<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #dbeafe, #f1f5f9);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 16px;
      overflow-x: hidden;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      overflow: hidden;
      text-align: center;
    }
    .card-header {
      padding: 18px;
      color: #3b82f6;
      font-size: 1.5rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .card-body {
      background: #eef2f7;
      padding: 30px 20px 24px;
    }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .verify { color: #22c55e; font-size: .85rem; margin-top: 12px; }
    .name { color: #3b82f6; font-size: 1.4rem; font-weight: bold; margin-top: 6px; }
    .desc { color: #3b82f6; font-size: .85rem; margin-top: 4px; }
    .info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #d1d5db;
      text-align: center;
    }
    .info div { flex: 1; font-size: .85rem; }
    .info h4 { color: #3b82f6; font-weight: normal; font-size: 1rem; margin-bottom: 10px; }
    .info p { color: #333; margin: 6px 0; word-break: break-word; }
    .info a { color: #333; text-decoration: none; }

    /* Lớp hiệu ứng hoa và tuyết */
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">About Me</div>
    <div class="card-body">
      <img class="avatar" src="https://via.placeholder.com/140" alt="Ảnh đại diện">
      <div class="verify">✔ Verify</div>
      <div class="name">Tên của bạn</div>
      <div class="desc">Mô tả ngắn về bản thân</div>

      <div class="info">
        <div>
          <h4>Công việc</h4>
          <p>🌐 yourwebsite.com</p>
          <p>💼 Nghề nghiệp của bạn</p>
        </div>
        <div>
          <h4>Thông tin liên lạc</h4>
          <p>✉️ <a href="mailto:ten@email.com">ten@email.com</a></p>
          <p>📘 <a href="https://facebook.com/tenban" target="_blank">facebook.com/tenban</a></p>
        </div>
      </div>
    </div>
  </div>
