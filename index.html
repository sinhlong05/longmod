<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bio của tôi</title>
<style>
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(160deg,#1e1b4b,#0f172a);color:#e2e8f0;display:flex;justify-content:center;padding:40px 16px;box-sizing:border-box;overflow-x:hidden}
.wrap{width:100%;max-width:420px;text-align:center;position:relative;z-index:2}
.avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#22d3ee);margin:0 auto 14px}
h1{margin:0;font-size:1.5rem}
.job{color:#a5b4fc;font-size:.9rem;margin:4px 0 12px}
.bio{color:#cbd5e1;font-size:.95rem;line-height:1.6;margin-bottom:24px}
.btn{display:block;padding:14px;margin:10px 0;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-weight:600}
.btn:hover{background:rgba(168,85,247,.25)}
.foot{margin-top:28px;font-size:.8rem;color:#64748b}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="avatar"></div>
  <h1>Tên của bạn</h1>
  <div class="job">Nghề nghiệp / vai trò của bạn</div>
  <div class="bio">Giới thiệu ngắn về bản thân, điều bạn làm và điều bạn quan tâm.</div>

  <a class="btn" href="https://zalo.me/0000000000" target="_blank">Liên hệ qua Zalo</a>
  <a class="btn" href="mailto:ten@email.com">Gửi email</a>
  <a class="btn" href="https://facebook.com/tenban" target="_blank">Facebook</a>
  <a class="btn" href="https://example.com/tai-xuong" target="_blank">Tải tài liệu</a>

  <div class="foot">© 2026 Tên của bạn</div>
</div>
<canvas id="fx"></canvas>
<script>
const c=document.getElementById('fx'),x=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight}
rs();onresize=rs;
function mk(f,top){return{f,x:Math.random()*c.width,y:top?-20:Math.random()*c.height,s:f?14+Math.random()*8:2+Math.random()*3,v:.6+Math.random()*1.4,w:Math.random()*6.28,r:Math.random()*6.28}}
const P=[...Array(60)].map((_,i)=>mk(i%3==0,false));
function d(){
  x.clearRect(0,0,c.width,c.height);
  for(const p of P){
    p.w+=.02;p.x+=Math.sin(p.w)*.6;p.y+=p.v;p.r+=.02;
    if(p.y>c.height+30)Object.assign(p,mk(p.f,true));
    x.save();x.translate(p.x,p.y);
    if(p.f){x.rotate(p.r);x.font=p.s+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🌸',0,0)}
    else{x.beginPath();x.arc(0,0,p.s,0,6.28);x.fillStyle='#fff';x.fill()}
    x.restore();
  }
  requestAnimationFrame(d);
}
d();
</script>
</body>
</html>
