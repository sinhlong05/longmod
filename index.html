<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trang cá nhân</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px 14px}
.wrap{max-width:560px;margin:auto}
.card{background:#1e293b;border-radius:16px;padding:20px;margin-bottom:16px}
h1{color:#38bdf8;margin:0 0 6px;font-size:1.6rem;text-align:center}
h2{color:#38bdf8;font-size:1.1rem;margin:18px 0 8px}
p{margin:6px 0;text-align:center}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;background:#334155}
a{color:#7dd3fc}
.dl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #334155}
.btn{background:#0ea5e9;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:.95rem;margin:4px 6px 4px 0}
.gray{background:#475569}
label{font-size:.9rem;color:#94a3b8}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;margin:4px 0 12px;font-size:.95rem}
#e{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="v"></div>
  <div class="card" id="e"></div>
  <button class="btn" id="b">Đăng nhập để chỉnh sửa</button>
</div>
<script>
const PASS="123456"; // Đổi mật khẩu tại đây

const DEF={
  name:"Tên của bạn",
  avatar:"",
  job:"Nghề nghiệp của bạn",
  bio:"Giới thiệu ngắn về bản thân, sở thích và điều bạn đang làm.",
  email:"ten@email.com",
  fb:"https://facebook.com/tenban",
  dl:"Tệp mẫu 1|https://example.com\nTệp mẫu 2|https://example.com"
};
let D=JSON.parse(localStorage.getItem('profile')||'null')||DEF;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function render(){
  const dl=D.dl.split('\n').filter(l=>l.includes('|')).map(l=>{
    const [t,u]=l.split('|');
    return `<div class="dl"><span>${esc(t.trim())}</span><a href="${esc(u.trim())}" target="_blank">Tải xuống</a></div>`;
  }).join('')||'<p>Chưa có tệp nào.</p>';

  $('v').innerHTML=
    (D.avatar?`<img class="avatar" src="${esc(D.avatar)}" alt="">`:`<div class="avatar"></div>`)+
    `<h1>${esc(D.name)}</h1>
    <p>${esc(D.job)}</p>
    <p>${esc(D.bio)}</p>
    <h2>Liên hệ</h2>
    <p>📧 <a href="mailto:${esc(D.email)}">${esc(D.email)}</a></p>
    <p>📘 <a href="${esc(D.fb)}" target="_blank">Facebook</a></p>
    <h2>Tải xuống</h2>${dl}`;
}

function openEd(){
  $('e').innerHTML=`<h2>Chỉnh sửa thông tin</h2>
  <label>Tên</label><input id="fn" value="${esc(D.name)}">
  <label>Link ảnh đại diện (để trống nếu không có)</label><input id="fa" value="${esc(D.avatar)}">
  <label>Nghề nghiệp</label><input id="fj" value="${esc(D.job)}">
  <label>Giới thiệu</label><textarea id="fbio" rows="3">${esc(D.bio)}</textarea>
  <label>Email</label><input id="fe" value="${esc(D.email)}">
  <label>Link Facebook</label><input id="ff" value="${esc(D.fb)}">
  <label>Tệp tải xuống (mỗi dòng: Tên|link)</label><textarea id="fd" rows="5">${esc(D.dl)}</textarea>
  <button class="btn" id="save">Lưu</button><button class="btn gray" id="cancel">Hủy</button>`;
  $('e').style.display='block';
  $('b').textContent='Đóng';
  $('save').onclick=()=>{
    D={name:$('fn').value,avatar:$('fa').value,job:$('fj').value,bio:$('fbio').value,
       email:$('fe').value,fb:$('ff').value,dl:$('fd').value};
    localStorage.setItem('profile',JSON.stringify(D));
    render(); closeEd();
  };
  $('cancel').onclick=closeEd;
}

function closeEd(){
  $('e').style.display='none';
  $('b').textContent='Đăng nhập để chỉnh sửa';
}

$('b').onclick=()=>{
  if($('e').style.display==='block'){ closeEd(); return; }
  if(prompt('Nhập mật khẩu:')!==PASS){ alert('Sai mật khẩu'); return; }
  openEd();
};

render();
</script>
</body>
</html>
